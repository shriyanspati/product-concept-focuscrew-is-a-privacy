<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soryvo Category</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Soryvo Focus Check</p>
      <h1>Private activity signals</h1>
      <p id="status">Sharing off</p>
      <dl>
        <div><dt>Broad category</dt><dd id="category">Unknown</dd></div>
        <div><dt>Tab switches</dt><dd id="switch-count">0</dd></div>
      </dl>
      <p class="note">
        Opt-in and session-only. Soryvo never receives URLs, titles, searches, page contents, screenshots, or browser history.
      </p>
      <button id="start" type="button">Start private signals</button>
      <button id="stop" type="button" class="secondary">Stop &amp; clear</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
